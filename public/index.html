<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width"=device-width, initial-scale="1.0">
    <title>WORKOUT TRACKER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1> 🏃‍♂️ Your Workout Tracer 🏃🏾‍♀️</h1>
    </header>
    <main class="container">
        <section class="form-section">
            <h2>Add New Workout</h2>
            <form id="workout-form">
                <div class="form-group">
                    <label for ="title">Workout Title: </label>
                    <input type="text" id = "title" required placeholder="e.g., Morning Cardio">
                </div>
                <div class="form-group">
                    <label for ="duration">Duration (mins): </label>
                    <input type="number" id = "duration" required placeholder="30">
                </div>
                <div class="form-group">
                    <label for ="reps">Reps: </label>
                    <input type="number" id = "reps" required placeholder="1">
                </div>
                <button type="submit">Add Workout</button>
            </form>
        </section>
        <section class="display-section">
            <h2>Your Workouts</h2>
            <div id="workouts-container">
                <p>Loading workouts...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
